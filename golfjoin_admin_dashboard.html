      const forceRegenerate = button.dataset.forceRegenerate === "true";
      if (quoteUrl && !forceRegenerate) {

        return;
      }
      const rowElement = button.closest("tr[data-schedule-key][data-participant-index]");
      if (!rowElement) return;
      const schedule = findSchedule(rowElement.dataset.scheduleKey);
      const participant = schedule?.participants?.[Number(rowElement.dataset.participantIndex)];
      if (!participant) return;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 신청 정보를 찾을 수 없습니다.");
        return;
      }
      const confirmed = await openConfirmDialog({
        title: forceRegenerate ? "견적 다시생성" : "견적생성",
        message: `${getParticipantName(participant) || "참여자"}님의 예약요청 견적서를 ${forceRegenerate ? "새 양식으로 다시 생성" : "생성"}할까요?`,
        okText: forceRegenerate ? "다시생성" : "견적생성"
      });
      if (!confirmed) return;
      const auth = getAdminAuth();
      const url = new URL(SHEET_API_ENDPOINT);
      url.searchParams.set("action", "quote_generate");
      button.disabled = true;
      showDashboardLoading("견적서 PDF를 생성하는 중입니다.");
      try {
        const response = await fetch(url.toString(), {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Golfjoin-Admin-Token": auth.token || ""
          },
          body: JSON.stringify({
            sheet: getParticipantSheetName(participant),
            keyField: "applicationId",
            keyValue: applicationId,
            participant,
            schedule: schedule?.row || {},
            product: schedule?.product || {}
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.error || `견적서 생성 실패: ${response.status}`);
        Object.assign(participant, result.fields || {}, {
          quoteId: result.quoteId || result.fields?.quoteId || participant.quoteId,
          quoteUrl: result.quoteUrl || result.fields?.quoteUrl || participant.quoteUrl,
          quoteFileName: result.quoteFileName || result.fields?.quoteFileName || participant.quoteFileName,
          quoteGeneratedAt: result.quoteGeneratedAt || result.fields?.quoteGeneratedAt || participant.quoteGeneratedAt,
          updatedAt: nowKstISOString()
        });
        renderMetrics();
        renderTable();
        const nextUrl = result.quoteUrl || result.fields?.quoteUrl || "";
        if (nextUrl) window.open(nextUrl, "_blank", "noopener");
      } catch (error) {
        const message = String(error?.message || "");
        if (/abort|timed out|timeout/i.test(message)) {
          alert(`견적서 생성 시간이 초과되었습니다.\n${message}\n잠시 후 다시 시도해 주세요.`);
        } else {
          alert(message || "견적서 생성에 실패했습니다.");
        }
      } finally {
        hideDashboardLoading();
        button.disabled = false;
      }
    }

    async function saveQuoteComplete(button) {
      const rowElement = button.closest("tr[data-schedule-key][data-participant-index]");
      if (!rowElement) return;
      const schedule = findSchedule(rowElement.dataset.scheduleKey);
      const participant = schedule?.participants?.[Number(rowElement.dataset.participantIndex)];
      if (!participant) return;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 저장 행을 찾을 수 없습니다.");
        return;
      }
      const fields = {
        quoteStatus: "sent",
        participantStatus: "견적완료"
      };
      const previousFields = {
        quoteStatus: participant.quoteStatus,
        participantStatus: participant.participantStatus,
        updatedAt: participant.updatedAt
      };
      Object.assign(participant, fields, { updatedAt: nowKstISOString() });
      renderMetrics();
      if (state.currentSchedulePanel === "consultation") renderTable();
      try {
        await submitAdminStatusUpdate(participant, applicationId, fields);
      } catch (error) {
        Object.assign(participant, previousFields);
        renderMetrics();
        if (state.currentSchedulePanel === "consultation") renderTable();
        alert(error.message || "저장에 실패했습니다.");
      }
    }

    async function saveQuoteComplete(button) {
      const rowElement = button.closest("tr[data-schedule-key][data-participant-index]");
      if (!rowElement) return;
      const schedule = findSchedule(rowElement.dataset.scheduleKey);
      const participant = schedule?.participants?.[Number(rowElement.dataset.participantIndex)];
      if (!participant) return;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 저장 행을 찾을 수 없습니다.");
        return;
      }
      const confirmed = await openConfirmDialog({
        title: "견적완료",
        message: `${getParticipantName(participant) || "참여자"}님의 상태를 '견적완료'로 처리할까요?`,
        okText: "견적완료"
      });
      if (!confirmed) return;
      const fields = {
        quoteStatus: "sent",
        participantStatus: "견적완료"
      };
      const previousFields = {
        quoteStatus: participant.quoteStatus,
        participantStatus: participant.participantStatus,
        updatedAt: participant.updatedAt
      };
      Object.assign(participant, fields, { updatedAt: nowKstISOString() });
      renderMetrics();
      if (state.currentSchedulePanel === "consultation") renderTable();
      try {
        await submitAdminStatusUpdate(participant, applicationId, fields);
      } catch (error) {
        Object.assign(participant, previousFields);
        renderMetrics();
        if (state.currentSchedulePanel === "consultation") renderTable();
        alert(error.message || "저장에 실패했습니다.");
      }
    }

    $("#loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const loginId = $("#adminIdInput").value.trim();
      const loginPassword = $("#adminPasswordInput").value;
      if (!loginId || !loginPassword) {
        $("#loginError").textContent = "아이디와 비밀번호를 모두 입력해 주세요.";
        return;
      }
      try {
        await loginAdmin(loginId, loginPassword);
        showApp();
        await loadDashboard();
      } catch (error) {
        clearAdminAuth();
        stopDashboardAutoRefresh();
        showLogin(error.message || "로그인에 실패했습니다.");
      }
    });

    $("#logoutButton").addEventListener("click", () => {
      stopDashboardAutoRefresh();
      clearAdminAuth();
      showLogin("");
    });
    $("#reloadButton").addEventListener("click", loadDashboard);
    $("#searchInput").addEventListener("input", () => {
      if (state.currentMenu === "recommended-schedules") return;
      renderTable();
    });
    $("#searchInput").addEventListener("keydown", (event) => {
      if (state.currentMenu !== "recommended-schedules" || event.key !== "Enter") return;
      event.preventDefault();
      renderTable();
    });
    $("#statusFilter").addEventListener("change", () => {
      state.currentSchedulePanel = "schedules";
      renderMetrics();
      renderTable();
    });
    $("#drawerClose").addEventListener("click", closeDrawer);
    $("#drawerBackdrop").addEventListener("click", closeDrawer);

    $("#tableWrap").addEventListener("change", (event) => {
      const monthlyToggle = event.target.closest("[data-recommendation-monthly]");
      if (!monthlyToggle) return;
      const row = monthlyToggle.closest("tr[data-recommendation-product]");
      const input = row?.querySelector("[data-recommendation-capacity]");
      if (input && monthlyToggle.checked && (!Number(input.value) || Number(input.value) === 4)) input.value = "40";
    });

    document.getElementById("quoteEditorForm")?.addEventListener("input", syncQuoteEditorDraftFromForm);
    document.getElementById("quoteEditorForm")?.addEventListener("change", syncQuoteEditorDraftFromForm);
    document.getElementById("quoteEditorClose")?.addEventListener("click", closeQuoteEditor);
    document.getElementById("quoteEditorCancel")?.addEventListener("click", closeQuoteEditor);
    document.getElementById("quoteEditorConfirm")?.addEventListener("click", submitQuoteEditor);
    document.getElementById("quoteEditorBackdrop")?.addEventListener("click", (event) => {
      if (event.target === event.currentTarget) closeQuoteEditor();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && document.getElementById("quoteEditorBackdrop")?.classList.contains("open")) closeQuoteEditor();
    });

    $("#tableWrap").addEventListener("click", (event) => {
      const recommendationRefreshButton = event.target.closest('[data-action="recommendation-refresh-products"]');
      if (recommendationRefreshButton) {
        refreshRecommendationProductsFromHomepage();
        return;
      }
      const calendarDateButton = event.target.closest("[data-recommendation-date-key]");
      if (calendarDateButton) {
        const picker = calendarDateButton.closest("[data-recommendation-calendar]");
        updateRecommendationCalendarPicker(picker, calendarDateButton.dataset.recommendationDateKey || "");
        picker?.classList.remove("open");
        return;
      }
      const calendarNavButton = event.target.closest('[data-action="recommendation-calendar-prev"], [data-action="recommendation-calendar-next"]');
      if (calendarNavButton) {
        const picker = calendarNavButton.closest("[data-recommendation-calendar]");
        if (picker) {
          const delta = calendarNavButton.dataset.action === "recommendation-calendar-prev" ? -1 : 1;
          picker.dataset.month = addRecommendationMonths(picker.dataset.month || "", delta);
          updateRecommendationCalendarPicker(picker);
        }
        return;
      }
      const calendarCloseButton = event.target.closest('[data-action="recommendation-calendar-close"]');
      if (calendarCloseButton) {
        calendarCloseButton.closest("[data-recommendation-calendar]")?.classList.remove("open");
        return;
      }
      const calendarToggleButton = event.target.closest('[data-action="recommendation-calendar-toggle"]');
      if (calendarToggleButton) {
        const picker = calendarToggleButton.closest("[data-recommendation-calendar]");
        document.querySelectorAll(".recommendation-calendar-picker.open").forEach((item) => {
          if (item !== picker) item.classList.remove("open");
        });
        picker?.classList.toggle("open");
        return;
      }
      const monthlyToggle = event.target.closest("[data-recommendation-monthly]");
      if (monthlyToggle) {
        const row = monthlyToggle.closest("tr[data-recommendation-product]");
        const input = row?.querySelector("[data-recommendation-capacity]");
        if (input && monthlyToggle.checked && (!Number(input.value) || Number(input.value) === 4)) input.value = "40";
        return;
      }
      const recommendationProductViewButton = event.target.closest('[data-action="recommendation-product-view"]');
      if (recommendationProductViewButton) {
        openRecommendationCandidateProduct(recommendationProductViewButton).catch((error) => {
          alert(error.message || "상품 상세를 불러오지 못했습니다.");
        });
        return;
      }
      const recommendationCandidateButton = event.target.closest('[data-action="recommendation-register-candidate"]');
      if (recommendationCandidateButton) {
        confirmAndSaveRecommendationSchedule(recommendationCandidateButton).catch((error) => {
          alert(error.message || "추천 일정 저장에 실패했습니다.");
        });
        return;
      }
      const recommendationHideButton = event.target.closest('[data-action="recommendation-hide"]');
      if (recommendationHideButton) {
        hideRecommendationSchedule(recommendationHideButton).catch((error) => {
          alert(error.message || "추천 일정 숨김에 실패했습니다.");
        });
        return;
      }
      const quoteViewButton = event.target.closest('[data-action="quote-view"]');
      if (quoteViewButton) {
        const quoteUrl = quoteViewButton.dataset.quoteUrl || "";
        if (quoteUrl) window.open(quoteUrl, "_blank", "noopener");
        return;
      }
      const quoteEditorButton = event.target.closest('[data-action="quote-editor"]');
      if (quoteEditorButton) {
        openQuoteEditor(quoteEditorButton);
        return;
      }
      const quoteSendButton = event.target.closest('[data-action="quote-send-placeholder"]');
      if (quoteSendButton) {
        alert("견적서 알림톡 템플릿 등록 후 전송 기능이 활성화됩니다.");
        return;
      }
      const participantStatusButton = event.target.closest('[data-action="participant-status-update"]');
      if (participantStatusButton) {
        saveParticipantStatus(participantStatusButton);
        return;
      }
      if (state.currentMenu === "participant-management") {
        const travelButton = event.target.closest('[data-action="customer-travels"]');
        if (!travelButton) return;
        const key = travelButton.dataset.customerKey || "";
        state.expandedCustomerKey = state.expandedCustomerKey === key ? "" : key;
        renderTable();
        return;
      }
      if (event.target.closest(".participant-table-wrap")) return;
      const button = event.target.closest("[data-action][data-key]");
      if (!button) {
        if (state.currentMenu !== "schedules" || state.currentSchedulePanel !== "schedules") return;
        const rowElement = event.target.closest('tr[data-schedule-key]:not(.participant-accordion-row)');
        if (!rowElement || event.target.closest(".row-actions")) return;
        const schedule = findSchedule(rowElement.dataset.scheduleKey);
        if (!schedule) return;
        state.expandedParticipantKey = state.expandedParticipantKey === schedule.key ? "" : schedule.key;
        renderTable();
        return;
      }
      const schedule = findSchedule(button.dataset.key);
      if (!schedule) return;
      if (button.dataset.action === "participants") {
        state.expandedParticipantKey = state.expandedParticipantKey === schedule.key ? "" : schedule.key;
        renderTable();
      }
      if (button.dataset.action === "product") openProductDrawer(schedule);
    });

    $("#drawerBody").addEventListener("click", (event) => {
      const button = event.target.closest('[data-action="participant-status-update"]');
      if (!button) return;
      saveParticipantStatus(button);
    });

    $("#metrics").addEventListener("click", (event) => {
      const recommendationRefreshButton = event.target.closest('[data-action="recommendation-refresh-products"]');
      if (recommendationRefreshButton) {
        refreshRecommendationProductsFromHomepage();
        return;
      }
      const metric = event.target.closest("[data-metric-action]");
      if (!metric || state.currentMenu !== "schedules") return;
      const action = metric.dataset.metricAction || "open";
      if (action === "consultation") {
        state.currentSchedulePanel = "consultation";
      } else {
        state.currentSchedulePanel = "schedules";
        if (["open", "closed", "cancelled", "confirmed"].includes(action)) {
          $("#statusFilter").value = action;
        }
      }
      renderMetrics();
      renderTable();
    });

    document.querySelectorAll(".nav-button").forEach((button) => {
      button.addEventListener("click", () => {
        const previousMenu = state.currentMenu;
        document.querySelectorAll(".nav-button").forEach((item) => item.classList.toggle("active", item === button));
        state.currentMenu = button.dataset.menu || "schedules";
        if (previousMenu !== state.currentMenu) {
          const searchInput = $("#searchInput");
          if (searchInput) searchInput.value = "";
        }
        state.currentSchedulePanel = "schedules";
        $("#pageTitle").textContent = button.textContent.trim();
        $(".page-sub").textContent = state.currentMenu === "participant-management"
          ? "조인 페이지에 회원가입한 고객 정보를 확인합니다."
          : "항공팩, 골프팩 일정별 참여자와 상품 상세 정보를 확인합니다.";
        if (state.currentMenu === "recommended-schedules") {
          $(".page-sub").textContent = "참여 가능한 일정이 없을 때 노출할 관리자 추천 상품/출발일을 관리합니다.";
        }
        renderMetrics();
        renderTable();
      });
    });

    if (getAdminAuth().token) {
      showApp();
      if (sessionStorage.getItem(RECOMMENDATION_REGISTER_RELOAD_KEY) === "1") {
        sessionStorage.removeItem(RECOMMENDATION_REGISTER_RELOAD_KEY);
        activateScheduleManagementView();
      }
      loadDashboard();
    } else {
      showLogin("");
    }
  </script>
</body>
</html>
