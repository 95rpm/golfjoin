        row.roomType
      ) || "2인1실";
    }

    function getParticipantFlightRequestType(row = {}, schedule = {}) {
      const requestType = firstText(
        getNestedValue(row, "applicant.flightRequestType"),
        row.flightRequestType
      );
      if (requestType) return requestType;
      const packType = schedule.packType || getPackType(row, schedule.product || findProduct(row));
      return packType === "air" ? "대행요청" : "";
    }

    function getParticipantSingleRoomSurcharge(row = {}) {
      return firstText(
        getNestedValue(row, "applicant.singleRoomSurcharge"),
        row.singleRoomSurcharge
      );
    }

    function renderParticipantRoomType(row = {}) {
      const roomType = getParticipantRoomType(row);
      const surcharge = getParticipantSingleRoomSurcharge(row);
      if (roomType === "1인1실" && Number(String(surcharge || "").replace(/[^0-9.-]/g, "")) > 0) {
        return `${escapeHtml(roomType)}<br><span class="muted">+${escapeHtml(formatPrice(surcharge))}</span>`;
      }
      return escapeHtml(roomType || "-");
    }

    function parseCompanionItems(value) {
      if (Array.isArray(value)) return value.filter(Boolean);
      const text = asText(value);
      if (!text) return [];
      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) return parsed.filter(Boolean);
        if (parsed && typeof parsed === "object") return [parsed];
      } catch (error) {}
      return parseList(text).map((gender) => ({ gender }));
    }

    function getParticipantCompanionItems(row = {}) {
      return parseCompanionItems(
        getNestedValue(row, "applicant.companions")
        || row.applicantCompanions
        || row.creatorCompanions
        || row.companions
      );
    }

    function getParticipantPeopleCount(row = {}) {
      const value = firstText(
        getNestedValue(row, "applicant.people"),
        row.applicantPeople,
        row.creatorPeople,
        row.people
      );
      const count = Number(String(value || "").replace(/\D/g, ""));
      return Number.isFinite(count) && count > 0 ? count : 1;
    }

    function formatCompanionGenderSummary(items = []) {
      const counts = items.reduce((map, item) => {
        const gender = asText(item?.gender || item?.sex || item);
        if (!gender) return map;
        map.set(gender, (map.get(gender) || 0) + 1);
        return map;
      }, new Map());
      return Array.from(counts.entries()).map(([gender, count]) => `${gender} ${count}명`).join(", ");
    }

    function formatParticipantCompanionSummary(row = {}, companionRows = []) {
      const companions = [
        ...getParticipantCompanionItems(row),
        ...companionRows.map((item) => ({ gender: getParticipantGender(item) }))
      ];
      const people = Math.max(getParticipantPeopleCount(row), companions.length + 1);
      if (people <= 1 && !companions.length) return "";
      const companionCount = Math.max(people - 1, companions.length);
      const genderSummary = formatCompanionGenderSummary(companions);
      return `총 ${people}명 · 동반자 ${genderSummary || `${companionCount}명`}`;
    }

    function isCompanionOnlyParticipant(row = {}) {
      const type = firstText(row.participantType, row.type, row.recordType).toLowerCase();
      const name = getParticipantName(row);
      return type === "companion" || /^동반자\d*$/i.test(name);
    }

    function isCompanionOnlyParticipant(row = {}) {
      const type = firstText(row.participantType, row.type, row.recordType).toLowerCase();
      const name = getParticipantName(row);
      return type === "companion"
        || /companion/i.test(type)
        || /^동반자\s*\d*$/i.test(name)
        || /동반자/.test(firstText(row.role, row.roleLabel, row.participantRole));
    }

    function findProduct(row = {}) {
      const erpProductId = firstText(
        getNestedValue(row, "trip.erpProductId"),
        getNestedValue(row, "trip.productId"),
        getNestedValue(row, "product.erpProductId"),
        getNestedValue(row, "product.goodSeq"),
        row.erpProductId,
        row.productId,
        row.goodSeq
      );
      const erpEventSeq = firstText(
        getNestedValue(row, "trip.erpEventSeq"),
        getNestedValue(row, "product.erpEventSeq"),
        getNestedValue(row, "product.eventSeq"),
        row.erpEventSeq,
        row.eventSeq
      );
      const title = getTitle(row);
      return products.find((product) => erpProductId && (
        asText(product.id) === erpProductId ||
        asText(product.goodSeq) === erpProductId ||
        asText(product.erpProductId) === erpProductId
      ) && (!erpEventSeq || asText(product.eventSeq) === erpEventSeq || asText(product.erpEventSeq) === erpEventSeq))
        || products.find((product) => erpProductId && (asText(product.goodSeq) === erpProductId || asText(product.erpProductId) === erpProductId))
        || products.find((product) => title && asText(product.title) === title)
        || {};
    }

    function getRecommendationDisplayRuleId(rule = {}) {
      return asText(rule.recommendedScheduleId || rule.displayRuleId) || `rs-${asText(rule.erpProductId || rule.goodSeq)}-${asText(rule.erpEventSeq || rule.eventSeq)}`;
    }

    function getRecommendationScheduleKey(rule = {}) {
      return `admin-recommended-${getRecommendationDisplayRuleId(rule)}`;
    }

    function isActiveRecommendationRule(rule = {}) {
      return asText(rule.section || "available_schedule") === "available_schedule" && isDisplayRuleVisible(rule);
    }

    function getRecommendationRuleCapacity(rule = {}) {
      const value = Number(rule.capacity || rule.maxPeople || rule.recruitmentCapacity || 0);
      return Number.isFinite(value) && value > 0 ? Math.round(value) : 4;
    }

    function isMonthlyRecommendationRule(rule = {}) {
      return asText(rule.scheduleType || rule.displayType || rule.badgeType).toLowerCase() === "monthly"
        || asText(rule.scheduleLabel || rule.badgeLabel || rule.adminMemo).includes("월례회");
    }

    function buildRecommendationScheduleRow(rule = {}) {
      const product = findProduct({
        erpProductId: rule.erpProductId,
        erpEventSeq: rule.erpEventSeq,
        productName: rule.overrideTitle
      });
      const period = extractTripSummaryPeriod({ productName: rule.overrideTitle || product.title, title: rule.overrideTitle || product.title }, product) || formatTripNightsDays(rule.displayStartAt || product.departureDate, rule.displayEndAt || product.returnDate || product.departureDate);
      return {
        applicationId: getRecommendationDisplayRuleId(rule),
        scheduleId: getRecommendationScheduleKey(rule),
        source: "recommended_schedule",
        applicationStatus: "open",
        displayStatus: rule.isVisible === false ? "hidden" : "visible",
        approvalStatus: "approved",
        productName: rule.overrideTitle || product.title || "",
        title: rule.overrideTitle || product.title || "",
        erpProductId: rule.erpProductId || product.goodSeq || product.erpProductId || "",
        erpEventSeq: rule.erpEventSeq || product.eventSeq || product.erpEventSeq || "",
        goodSeq: rule.erpProductId || product.goodSeq || "",
        eventSeq: rule.erpEventSeq || product.eventSeq || "",
        country: getRecommendationRuleCountry(rule, product),
        region: getRecommendationRuleRegion(rule, product),
        departureAirport: rule.departureAirport || product.departureAirport || product.airport || "",
        arrivalAirport: rule.arrivalAirport || product.arrivalAirport || product.region || "",
        departureDate: rule.displayStartAt || product.departureDate || "",
        returnDate: rule.displayEndAt || product.returnDate || product.departureDate || "",
        tripSummary: period,
        dayNightCnt: period,
        duration: period,
        productPrice: product.price || "",
        price: product.price || "",
        packType: rule.packType || product.packType || "",
        packTypeName: rule.packTypeName || product.packTypeName || "",
        maxPeople: getRecommendationRuleCapacity(rule),
        capacity: getRecommendationRuleCapacity(rule),
        scheduleType: rule.scheduleType || (isMonthlyRecommendationRule(rule) ? "monthly" : ""),
        scheduleLabel: rule.scheduleLabel || (isMonthlyRecommendationRule(rule) ? "월례회" : ""),
        createdAt: rule.updatedAt || "",
        updatedAt: rule.updatedAt || "",
        adminMemo: rule.adminMemo || "",
        isRecommendationSchedule: true
      };
    }

    function findMatchingScheduleKeyForJoinRow(map, row = {}) {
      const targetKey = getScheduleKey(row, { preferTarget: true });
      if (targetKey && map.has(targetKey)) return targetKey;
      const productId = firstText(
        getNestedValue(row, "product.erpProductId"),
        getNestedValue(row, "product.goodSeq"),
        row.erpProductId,
        row.goodSeq,
        row.productId
      );
      const eventSeq = firstText(
        getNestedValue(row, "product.erpEventSeq"),
        getNestedValue(row, "product.eventSeq"),
        row.erpEventSeq,
        row.eventSeq
      );
      if (!productId || !eventSeq) return "";
      for (const [key, schedule] of map.entries()) {
        const scheduleProductId = firstText(schedule.row?.erpProductId, schedule.row?.goodSeq, schedule.product?.goodSeq, schedule.product?.erpProductId);
        const scheduleEventSeq = firstText(schedule.row?.erpEventSeq, schedule.row?.eventSeq, schedule.product?.eventSeq, schedule.product?.erpEventSeq);
        if (scheduleProductId === productId && scheduleEventSeq === eventSeq) return key;
      }
      return "";
    }

    function buildSchedules(builderRows, joinRows = [], displayRuleRows = []) {
      const map = new Map();
      builderRows.forEach((row, index) => {
        const key = getScheduleKey(row) || `schedule-${index}`;
        if (!map.has(key)) {
          const product = findProduct(row);
          map.set(key, {
            key,
            row,
            product,
            participants: [],
            packType: getPackType(row, product)
          });
        }
        map.get(key).participants.push(row);
      });
      displayRuleRows.filter(isActiveRecommendationRule).forEach((rule) => {
        const key = getRecommendationScheduleKey(rule);
        if (map.has(key)) return;
        const row = buildRecommendationScheduleRow(rule);
        const product = findProduct(row);
        map.set(key, {
          key,
          row,
          product,
          participants: [],
          packType: getPackType(row, product),
          isRecommendationSchedule: true
        });
      });
      joinRows.forEach((row) => {
        const key = findMatchingScheduleKeyForJoinRow(map, row);
        if (key && map.has(key)) {
          map.get(key).participants.push(row);
          return;
        }
        const fallbackKey = getScheduleKey(row);
        if (!fallbackKey || map.has(fallbackKey)) return;
        const product = findProduct(row);
        map.set(fallbackKey, {
          key: fallbackKey,
          row,
          product,
          participants: [row],
          packType: getPackType(row, product)
        });
      });
      return [...map.values()];
    }

    function filterSchedules() {
      const keyword = asText($("#searchInput").value).toLowerCase();
      const status = $("#statusFilter").value;
      return state.schedules.filter((schedule) => {
        const row = schedule.row;
        const haystack = [
          getTitle(row),
          getCountry(row, schedule.product),
          getRegion(row),
          getParticipantName(row),
          schedule.participants.map(getParticipantName).join(" ")
        ].join(" ").toLowerCase();
        return (!keyword || haystack.includes(keyword))
          && (!status || getScheduleFilterStatus(schedule) === status);
      });
    }

    function getScheduleFilterStatus(schedule = {}) {
      const operationStatus = getScheduleOperationStatus(schedule);
      if (operationStatus === "취소") return "cancelled";
      if (operationStatus === "출발확정") return "confirmed";
      if (operationStatus === "마감") return "closed";
      return "open";
    }

    function getScheduleStatusText(schedule = {}) {
      const row = schedule.row || {};
      return [
        row.applicationStatus,
        row.status,
        row.scheduleStatus,
        row.displayStatus,
        row.approvalStatus
      ].map(asText).join(" ").toLowerCase();
    }

    function isScheduleCancelled(schedule = {}) {
      return /(cancel|cancelled|canceled|취소|deleted|hidden|삭제|숨김)/i.test(getScheduleStatusText(schedule));
    }

    function isScheduleClosed(schedule = {}) {
      if (isScheduleCancelled(schedule)) return false;
      const statusText = getScheduleStatusText(schedule);
      if (/(closed|full|마감|모집완료)/i.test(statusText)) return true;
      const row = schedule.row || {};
      const people = schedule.participants.length;
      const capacity = Number(row.maxPeople || row.capacity || schedule.product.emptySlots || 0);
      return capacity > 0 && people >= capacity;
    }

    function isScheduleOpen(schedule = {}) {
      return !isScheduleCancelled(schedule) && !isScheduleClosed(schedule);
    }

    function getScheduleCapacity(schedule = {}) {
      const row = schedule.row || {};
      return Number(row.maxPeople || row.capacity || schedule.product.maxCapacity || 4) || 4;
    }

    function isParticipantBalancePaid(row = {}) {
      const status = asText(row.balanceStatus).toLowerCase();
      return /paid|confirmed|complete|완료|확인|입금/.test(status);
    }

    function isParticipantDepositPaid(row = {}) {
      const status = asText(row.depositStatus).toLowerCase();
      return /paid|confirmed|complete|완료|확인|입금/.test(status) || isParticipantBalancePaid(row);
    }

    function getSchedulePaymentCounts(schedule = {}) {
      const participants = getParticipantDisplayRows(schedule.participants || []);
      const getPeople = (item) => getParticipantPeopleTotal(item.row, item.companions);
      return {
        total: participants.reduce((sum, item) => sum + getPeople(item), 0),
        deposit: participants.reduce((sum, item) => sum + (isParticipantDepositPaid(item.row) ? getPeople(item) : 0), 0),
        balance: participants.reduce((sum, item) => sum + (isParticipantBalancePaid(item.row) ? getPeople(item) : 0), 0)
      };
    }

    function isScheduleDepartureConfirmed(schedule = {}) {
      if (isScheduleCancelled(schedule)) return false;
      const statusText = getScheduleStatusText(schedule);
      if (/(departure|confirmed|출발확정)/i.test(statusText)) return true;
      const capacity = getScheduleCapacity(schedule);
      const counts = getSchedulePaymentCounts(schedule);
      return counts.total >= capacity && counts.balance >= capacity;
    }

    function getScheduleOperationStatus(schedule = {}) {
      if (isScheduleCancelled(schedule)) return "취소";
      if (isScheduleDepartureConfirmed(schedule)) return "출발확정";
      if (isScheduleClosed(schedule)) return "마감";
      return "모집중";
    }

    function getScheduleStatusClass(status) {
      if (status === "취소") return "status-cancelled";
      if (status === "출발확정") return "status-confirmed";
      if (status === "마감") return "status-closed";
      return "status-open";
    }

    function formatSchedulePaymentSummary(schedule = {}) {
      const counts = getSchedulePaymentCounts(schedule);
      const total = counts.total || getScheduleCapacity(schedule);
      return `예약금 ${counts.deposit}/${total} · 잔금 ${counts.balance}/${total}`;
    }

    function renderSchedulePaymentCell(schedule = {}, type = "deposit") {
      const counts = getSchedulePaymentCounts(schedule);
      const total = counts.total || getScheduleCapacity(schedule);
      const paid = type === "balance" ? counts.balance : counts.deposit;
      if (total > 0 && paid >= total) {
        return '<span class="badge status-confirmed">입금완료</span>';
      }
      return `<span class="payment-summary">${escapeHtml(`${paid}/${total}`)}</span>`;
    }

    function isTodaySchedule(schedule = {}) {
      const row = schedule.row || {};
      const date = parseScheduleDate(firstText(row.createdAt, row.submittedAt, row.updatedAt));
      if (!date) return false;
      const today = new Date();
      return date.getFullYear() === today.getFullYear()
        && date.getMonth() === today.getMonth()
        && date.getDate() === today.getDate();
    }

    async function loadDashboard() {
      if (state.loading) return;
      state.loading = true;
      state.error = "";
      renderTable();
      try {
        await loadLatestSavedGolfJoinProductsData();
        const { builderRows, joinRows, profileRows, displayRuleRows } = await fetchAdminRows();
        state.rawRows = [...builderRows, ...joinRows];
        state.schedules = buildSchedules(builderRows, joinRows, displayRuleRows);
        state.memberProfiles = buildMemberProfiles(profileRows);
        state.displayRules = Array.isArray(displayRuleRows) ? displayRuleRows : [];
        $("#lastUpdated").textContent = `최근 갱신 ${formatDateTime(new Date())}`;
      } catch (error) {
        state.error = error.message || "데이터 로드 실패";
        if (!getAdminAuth().token) showLogin("로그인이 만료되었거나 인증에 실패했습니다.");
      } finally {
        state.loading = false;
        renderMetrics();
        renderTable();
      }
    }

    function stopDashboardAutoRefresh() {
      if (!dashboardAutoRefreshTimer) return;
      window.clearInterval(dashboardAutoRefreshTimer);
      dashboardAutoRefreshTimer = null;
    }

    function getRecommendationTodayISO() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function getRecommendationMinDepartureISO(offsetDays = 7) {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() + offsetDays);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function formatRecommendationProductDataStatus(productItems = getRecommendationProductItems()) {
      const uniqueCount = getRecommendationUniqueProductCount(productItems);
      const sourceLabel = productDataInfo.source === "live"
        ? "홈페이지 최신 API"
        : productDataInfo.source === "saved"
          ? "저장된 최신 데이터"
          : "로컬 데이터";
      const dateValue = productDataInfo.refreshedAt || productDataInfo.generatedAt || "";
      const dateLabel = dateValue ? formatDateTime(dateValue) || dateValue : "";
      return `${sourceLabel} 기준 / 전체 ${productDataInfo.count.toLocaleString()}개 / 추천 가능 상품 ${uniqueCount.toLocaleString()}개${dateLabel ? ` / ${dateLabel}` : ""}`;
    }

    async function refreshRecommendationProductsFromHomepage() {
      showDashboardLoading("상품정보를 업데이트하고 저장하는 중입니다.");
      try {
        const auth = getAdminAuth();
        const url = new URL(SHEET_API_ENDPOINT);
        url.searchParams.set("action", "refresh_secret_tour_products");
        const response = await fetch(url.toString(), {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Golfjoin-Admin-Token": auth.token || ""
          },
          body: JSON.stringify({ requestedAt: nowKstISOString() })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data.ok) {
          throw new Error(data.error || `상품정보 저장 업데이트에 실패했습니다. (${response.status})`);
        }
        if (!Array.isArray(data.items) || !data.items.length) {
          throw new Error("저장된 상품 목록을 받지 못했습니다.");
        }
        products = data.items;
        productDataInfo = {
          source: "live",
          generatedAt: data.generatedAt || "",
          refreshedAt: data.generatedAt || nowKstISOString(),
          count: Number(data.count || products.length) || products.length
        };
        secretTourGoodsDetailCache.clear();
        renderMetrics();
        renderTable();
      } catch (error) {
        console.error(error);
        alert(error.message || "상품정보 저장 업데이트에 실패했습니다.");
      } finally {
        hideDashboardLoading();
      }
    }

    function getRecommendationProductItems() {
      const minDepartureDate = getRecommendationMinDepartureISO(7);
      return products.map((product, index) => {
        const reference = getSecretTourProductReference({}, product);
        return {
          product,
          index,
          key: `${reference.goodSeq || asText(product.erpProductId) || asText(product.id) || index}::${reference.eventSeq || asText(product.erpEventSeq) || asText(product.eventSeq) || index}::${index}`,
          goodSeq: reference.goodSeq || asText(product.erpProductId) || asText(product.goodSeq),
          eventSeq: reference.eventSeq || asText(product.erpEventSeq) || asText(product.eventSeq)
        };
      }).filter((item) => item.goodSeq && item.eventSeq && asText(item.product.departureDate) >= minDepartureDate)
        .sort((a, b) => {
          const dateCompare = asText(a.product.departureDate).localeCompare(asText(b.product.departureDate));
          if (dateCompare) return dateCompare;
          return asText(a.product.title).localeCompare(asText(b.product.title), "ko");
        });
    }

    function getRecommendationUniqueProductCount(items = getRecommendationProductItems()) {
      return new Set(items.map((item) => item.goodSeq).filter(Boolean)).size;
    }

    function getRecommendationProductGroups(items = getRecommendationProductItems()) {
      const groups = new Map();
      items.forEach((item) => {
        const key = item.goodSeq;
        if (!groups.has(key)) {
          groups.set(key, {
            goodSeq: item.goodSeq,
            title: asText(item.product.title) || "상품명 없음",
            packType: getPackType({}, item.product),
            country: getRecommendationProductCountry(item.product),
            region: getRecommendationProductRegion(item.product),
            category: asText(item.product.category),
            period: extractTripSummaryPeriod({ productName: item.product.title, title: item.product.title }, item.product) || formatTripNightsDays(item.product.departureDate, item.product.returnDate),
            items: []
          });
        }
        groups.get(key).items.push(item);
      });
      return [...groups.values()].map((group) => {
        group.items.sort((a, b) => asText(a.product.departureDate).localeCompare(asText(b.product.departureDate)));
        group.firstDeparture = group.items[0]?.product?.departureDate || "";
        group.lastDeparture = group.items[group.items.length - 1]?.product?.departureDate || "";
        return group;
      }).sort((a, b) => {
        const dateCompare = asText(a.firstDeparture).localeCompare(asText(b.firstDeparture));
        if (dateCompare) return dateCompare;
        return asText(a.title).localeCompare(asText(b.title), "ko");
      });
    }

    function findRecommendationProductByKey(key) {
      return getRecommendationProductItems().find((item) => item.key === key) || null;
    }

    function parseRecommendationISODate(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(asText(value));
      if (!match) return null;
      return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    }

    function formatRecommendationMonth(value) {
      const date = parseRecommendationISODate(value);
      if (!date) return "";
      return `${date.getFullYear()}.${String(date.getMonth() + 1).padStart(2, "0")}`;
    }

    function addRecommendationMonths(monthISO, delta) {
      const date = parseRecommendationISODate(`${asText(monthISO).slice(0, 7)}-01`) || new Date();
      date.setMonth(date.getMonth() + delta);
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-01`;
    }

    function getRecommendationTodayMonthISO() {
      const today = new Date();
      return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-01`;
    }

    function formatRecommendationMonthRange(monthISO = "") {
      const startMonth = asText(monthISO) || getRecommendationTodayMonthISO();
      const endMonth = addRecommendationMonths(startMonth, 1);
      return `${formatRecommendationMonth(startMonth)} - ${formatRecommendationMonth(endMonth)}`;
    }

    function formatRecommendationManwon(value) {
      const number = Number(String(value || "").replace(/[^0-9.-]/g, ""));
      if (!Number.isFinite(number) || number <= 0) return "";
      const manwon = number / 10000;
      return `${Number.isInteger(manwon) ? String(manwon) : manwon.toFixed(1).replace(/\.0$/, "")}만`;
    }

    function getRecommendationSelectedKey(row) {
      const picker = row?.querySelector("[data-recommendation-calendar]");
      const select = row?.querySelector("[data-recommendation-departure]");
      return picker?.dataset.selectedKey || select?.value || "";
    }

    function normalizeRecommendationCapacity(value, fallback = 4) {
      const number = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
      const parsed = Number.isFinite(number) && number > 0 ? number : fallback;
      return Math.max(1, Math.min(200, Math.round(parsed)));
    }

    function getRecommendationRowOptions(row) {
      const monthly = Boolean(row?.querySelector("[data-recommendation-monthly]")?.checked);
      const input = row?.querySelector("[data-recommendation-capacity]");
      const capacity = normalizeRecommendationCapacity(input?.value, monthly ? 40 : 4);
      if (input) input.value = String(capacity);
      return {
        monthly,
        capacity
      };
    }

    function getRecommendationCalendarMonthItems(group = {}, monthISO = "") {
      const monthKey = asText(monthISO).slice(0, 7);
      return (group.items || []).filter((item) => asText(item.product.departureDate).slice(0, 7) === monthKey);
    }

    function renderRecommendationCalendarGrid(group = {}, selectedKey = "", monthISO = "") {
      const monthDate = parseRecommendationISODate(`${asText(monthISO).slice(0, 7)}-01`) || parseRecommendationISODate(group.firstDeparture);
      if (!monthDate) return "";
      const year = monthDate.getFullYear();
      const month = monthDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const itemsByDate = new Map();
      getRecommendationCalendarMonthItems(group, `${year}-${String(month + 1).padStart(2, "0")}-01`).forEach((item) => {
        const dateKey = asText(item.product.departureDate);
        if (!itemsByDate.has(dateKey)) itemsByDate.set(dateKey, item);
      });
      const cells = [];
      for (let index = 0; index < firstDay; index += 1) {
        cells.push('<div class="recommendation-calendar-day" aria-hidden="true"></div>');
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const dateKey = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const item = itemsByDate.get(dateKey);
        const active = item && item.key === selectedKey;
        const price = item ? formatRecommendationManwon(item.product.price) : "";
        const isToday = dateKey === getRecommendationTodayISO();
        const dayOfWeek = new Date(year, month, day).getDay();
        const weekendClass = dayOfWeek === 0 ? " weekend-sun" : dayOfWeek === 6 ? " weekend-sat" : "";
        cells.push(`
          <button class="recommendation-calendar-day${weekendClass}${item ? " available" : ""}${active ? " active" : ""}${isToday ? " today" : ""}" type="button" ${item ? `data-recommendation-date-key="${escapeHtml(item.key)}"` : "disabled"}>
            ${isToday ? '<span class="recommendation-calendar-today-label">TODAY</span>' : ""}
            <span class="recommendation-calendar-date">${escapeHtml(String(day))}</span>
            <span class="recommendation-calendar-price">${price ? escapeHtml(price) : ""}</span>
            <span class="recommendation-calendar-lowest"></span>
          </button>
        `);
      }
      return cells.join("");
    }

    function renderRecommendationCalendarMonths(group = {}, selectedKey = "", monthISO = "") {
      const startMonth = asText(monthISO) || getRecommendationTodayMonthISO();
      return [0, 1].map((offset) => {
        const visibleMonth = addRecommendationMonths(startMonth, offset);
        return `
          <div class="recommendation-calendar-month-block">
            <div class="recommendation-calendar-month-title">
              ${offset === 0 ? '<button class="recommendation-calendar-nav" type="button" data-action="recommendation-calendar-prev" aria-label="Previous month"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>' : '<span aria-hidden="true"></span>'}
              <div class="recommendation-calendar-month-title-text">${escapeHtml(formatRecommendationMonth(visibleMonth))}</div>
              ${offset === 1 ? '<button class="recommendation-calendar-nav" type="button" data-action="recommendation-calendar-next" aria-label="Next month"><svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>' : '<span aria-hidden="true"></span>'}
            </div>
            <div class="recommendation-calendar-weekdays">
              <span>&#51068;</span><span>&#50900;</span><span>&#54868;</span><span>&#49688;</span><span>&#47785;</span><span>&#44552;</span><span>&#53664;</span>
            </div>
            <div class="recommendation-calendar-grid">
              ${renderRecommendationCalendarGrid(group, selectedKey, visibleMonth)}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderRecommendationCalendarPicker(group = {}) {
      const selected = group.items[0] || null;
      const selectedKey = selected?.key || "";
      const selectedDate = selected?.product?.departureDate || group.firstDeparture || "";
      const selectedPrice = formatRecommendationManwon(selected?.product?.price);

    function updateRecommendationCalendarPicker(picker, productKey = "") {
      if (!picker) return;
      const groupId = picker.dataset.recommendationCalendar || "";
      const group = getRecommendationProductGroups().find((item) => asText(item.goodSeq) === asText(groupId));
      if (!group) return;
      if (productKey) picker.dataset.selectedKey = productKey;
      const selected = findRecommendationProductByKey(picker.dataset.selectedKey || "") || group.items[0];
      picker.dataset.selectedKey = selected?.key || "";
      const selectedDate = selected?.product?.departureDate || "";
      const selectedPrice = formatRecommendationManwon(selected?.product?.price);
      const toggle = picker.querySelector('[data-action="recommendation-calendar-toggle"]');
      if (toggle) {
        toggle.innerHTML = `${escapeHtml(formatDate(selectedDate) || selectedDate || "출발일 선택")}<span>${escapeHtml(selectedPrice)}</span>`;
      }
      const monthISO = picker.dataset.month || getRecommendationTodayMonthISO();
      const monthLabel = picker.querySelector(".recommendation-calendar-month");
      if (monthLabel) monthLabel.textContent = "출발일 선택";
      const months = picker.querySelector(".recommendation-calendar-months");
      if (months) months.innerHTML = renderRecommendationCalendarMonths(group, picker.dataset.selectedKey, monthISO);
    }

    function getConsultationApplicants(options = {}) {
      const keyword = options.useKeyword === false ? "" : asText($("#searchInput")?.value).toLowerCase();
      return state.schedules.flatMap((schedule) => {
        return getParticipantDisplayRows(schedule.participants || []).map((participant) => ({
          schedule,
          row: participant.row,
          index: participant.index,
          companions: participant.companions,
          roleLabel: getParticipantRoleLabel(participant.row),
          createdAt: firstText(participant.row.createdAt, participant.row.submittedAt, participant.row.updatedAt)
        }));
      }).filter((item) => {
        if (normalizeQuoteStatus(item.row.quoteStatus) === "sent") return false;
        const haystack = [
          item.roleLabel,
          getParticipantName(item.row),
          formatPhone(getParticipantPhone(item.row)),
          getCountry(item.schedule.row, item.schedule.product),
          getRegion(item.schedule.row),
          getTitle(item.schedule.row)
        ].join(" ").toLowerCase();
        return !keyword || haystack.includes(keyword);
      }).sort((a, b) => {
        return getTimeValue(b.createdAt) - getTimeValue(a.createdAt);
      });
    }

    function getTimeValue(value) {
      const date = new Date(value || 0);
      return Number.isNaN(date.getTime()) ? 0 : date.getTime();

    function normalizeParticipantGenderType(value) {
      const text = asText(value).toLowerCase();
      if (/여|female|woman|f\b/.test(text)) return "female";
      if (/남|male|man|m\b/.test(text)) return "male";
      return "";
    }

    function getSchedulePeopleGenderSlots(schedule = {}) {
      const slots = [];
      (schedule.participants || []).forEach((row) => {
        slots.push(normalizeParticipantGenderType(getParticipantGender(row)));
        getParticipantCompanionItems(row).forEach((companion) => {
          slots.push(normalizeParticipantGenderType(companion?.gender || companion?.sex || companion));
        });
      });
      return slots.slice(0, 4);
    }

    function renderSchedulePeopleIcons(schedule = {}) {
      const capacity = getScheduleCapacity(schedule);
      if (capacity > 4) {
        const people = getSchedulePaymentCounts(schedule).total;
        return `<span class="schedule-people-text" aria-label="${escapeHtml(`${people}명`)}" title="${escapeHtml(`${people}명`)}">${escapeHtml(`${people}명`)}</span>`;
      }
      const total = 4;
      const genderSlots = getSchedulePeopleGenderSlots(schedule);
      const fallbackFilled = Math.max(0, Math.min(total, Number(schedule.participants?.length) || 0));
      const filled = Math.max(genderSlots.length, fallbackFilled);
      const icon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      return `
        <div class="schedule-people-icons" aria-label="${escapeHtml(`${filled}/${total}명`)}" title="${escapeHtml(`${filled}/${total}명`)}">
          ${Array.from({ length: total }, (_, index) => {
            const genderClass = genderSlots[index] || "";
            return `<span class="schedule-people-icon${index < filled ? ` filled${genderClass ? ` ${genderClass}` : ""}` : ""}">${icon}</span>`;
          }).join("")}
        </div>
      `;
    }

    function getParticipantGenderSlots(row = {}, companionRows = []) {
      const slots = [
        normalizeParticipantGenderType(getParticipantGender(row)),
        ...getParticipantCompanionItems(row).map((companion) => normalizeParticipantGenderType(companion?.gender || companion?.sex || companion)),
        ...companionRows.map((item) => normalizeParticipantGenderType(getParticipantGender(item)))
      ];
      const total = Math.max(getParticipantPeopleCount(row), slots.length, 1);
      while (slots.length < total) slots.push("");
      return slots;
    }

    function getParticipantPeopleTotal(row = {}, companionRows = []) {
      const genderSlots = getParticipantGenderSlots(row, companionRows);
      return Math.max(1, Math.min(4, Math.max(getParticipantPeopleCount(row), genderSlots.length)));
    }

    function renderParticipantGenderIcons(row = {}, companionRows = []) {
      const genderSlots = getParticipantGenderSlots(row, companionRows);
      const total = getParticipantPeopleTotal(row, companionRows);
      const icon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
      return `
        <div class="schedule-people-icons participant-people-cell participant-gender-icons" aria-label="${escapeHtml(`${total}명 성별`)}" title="${escapeHtml(`${total}명 성별`)}">
          ${Array.from({ length: total }, (_, index) => {
            const genderClass = genderSlots[index] || "";
            return `<span class="schedule-people-icon filled${genderClass ? ` ${genderClass}` : ""}">${icon}</span>`;
          }).join("")}
        </div>
      `;
    }

    function renderParticipantAccordionRow(schedule) {

    function buildMemberProfiles(profileRows = []) {
      const latestByKey = new Map();
      profileRows.forEach((row, index) => {
        const profile = {
          ...row,
          __index: index
        };
        const key = normalizePhone(getProfilePhone(profile))
          || asText(profile.memberSeq)
          || asText(profile.memberId)
          || asText(profile.profileId)
          || `profile-${index}`;
        const previous = latestByKey.get(key);
        if (!previous || getProfileSortTime(profile) >= getProfileSortTime(previous)) {
          latestByKey.set(key, profile);
        }
      });
      return [...latestByKey.values()].sort((a, b) => getProfileSortTime(b) - getProfileSortTime(a));
    }

    function getProfileSortTime(profile = {}) {
      const date = new Date(firstText(profile.updatedAt, profile.createdAt, profile.termsAgreedAt));
      if (!Number.isNaN(date.getTime())) return date.getTime();
      return Number(profile.__index || 0);
    }

    function getProfileName(profile = {}) {
      return firstText(profile.memberName, profile.name, getNestedValue(profile, "member.memberName"));
    }

    function getProfilePhone(profile = {}) {
      return firstText(profile.memberMobile, profile.mobile, profile.phone, getNestedValue(profile, "member.memberMobile"));
    }

    function getProfileGender(profile = {}) {
      return firstText(profile.gender, profile.memberGender, getNestedValue(profile, "profile.gender"));
    }

    function getProfileBirthDate(profile = {}) {
      return firstText(profile.birthDate, profile.birthday, profile.birthYear, getNestedValue(profile, "profile.birthDate"), getNestedValue(profile, "profile.birthYear"));
    }

    function getProfileAge(profile = {}) {
      return calculateAge(getProfileBirthDate(profile));
    }

    function getProfileHandicap(profile = {}) {
      return firstText(profile.level, profile.handicap, profile.handy, getNestedValue(profile, "profile.level"));
    }

    function getProfileProfession(profile = {}) {
      return firstText(profile.profession, profile.specialty, profile.interests, getNestedValue(profile, "profile.profession"));
    }

    function getProfileRoundStyle(profile = {}) {
      return parseList(firstText(profile.travelStyles, profile.roundStyle, profile.roundingStyle, profile.styles, getNestedValue(profile, "profile.travelStyles"))).join(", ");
    }

    function getProfileRegisteredDate(profile = {}) {
      return firstText(profile.createdAt, profile.termsAgreedAt, profile.updatedAt);
    }

    function filterMemberProfiles() {
      const keyword = $("#searchInput").value.trim().toLowerCase();
      return state.memberProfiles.filter((profile) => {
        const haystack = [
          getProfileName(profile),
          formatPhone(getProfilePhone(profile)),
          normalizePhone(getProfilePhone(profile)),
          getProfileGender(profile),
          getProfileBirthDate(profile),
          formatDate(getProfileRegisteredDate(profile)),
          getProfileHandicap(profile),
          getProfileProfession(profile),
          getProfileRoundStyle(profile)
        ].join(" ").toLowerCase();
        return !keyword || haystack.includes(keyword);
      });

    function countActiveCustomers() {
      const activeKeys = new Set();
      state.schedules.forEach((schedule) => {
        (schedule.participants || []).forEach((row) => {
          if (isScheduleCancelled(schedule)) return;
          const key = normalizePhone(getParticipantPhone(row)) || asText(row.memberSeq) || asText(row.memberId);
          if (key) activeKeys.add(key);
        });
      });
      return state.memberProfiles.filter((profile) => {
        const key = normalizePhone(getProfilePhone(profile)) || asText(profile.memberSeq) || asText(profile.memberId);
        return key && activeKeys.has(key);
      }).length;
    }

    function getCustomerKey(profile = {}) {
      return normalizePhone(getProfilePhone(profile))
        || asText(profile.memberSeq)
        || asText(profile.memberId)
        || asText(profile.profileId)
        || asText(profile.__index);
    }

    function isSameCustomer(profile = {}, participant = {}) {
      const profilePhone = normalizePhone(getProfilePhone(profile));
      const participantPhone = normalizePhone(getParticipantPhone(participant));
      if (profilePhone && participantPhone && profilePhone === participantPhone) return true;
      const profileSeq = asText(profile.memberSeq);
      const participantSeq = asText(participant.memberSeq);
      if (profileSeq && participantSeq && profileSeq === participantSeq) return true;
      const profileId = asText(profile.memberId);
      const participantId = asText(participant.memberId);
      return Boolean(profileId && participantId && profileId === participantId);
    }

    function getCustomerTravelRows(profile = {}) {
      return state.schedules.flatMap((schedule) => {

          .map((item) => ({
            schedule,
            row: item.row,
            companions: item.companions
          }));
      }).sort((a, b) => getTimeValue(getDeparture(b.schedule.row, b.schedule.product)) - getTimeValue(getDeparture(a.schedule.row, a.schedule.product)));

      if (fieldName === "refundStatus" && value === "requested") return "취소";
      if (fieldName === "refundStatus" && value === "paid") return "환불";

    function openConfirmDialog({ title = "작업 확인", message = "", html = "", okText = "확인", cancelText = "취소", dialogClass = "" } = {}) {
      const backdrop = $("#confirmBackdrop");
      if (!backdrop) return Promise.resolve(window.confirm(message || title));
      const dialog = backdrop.querySelector(".confirm-dialog");
      if (dialog) dialog.className = `confirm-dialog${dialogClass ? ` ${dialogClass}` : ""}`;
      $("#confirmTitle").textContent = title;
      if (html) $("#confirmMessage").innerHTML = html;
      else $("#confirmMessage").textContent = message;
      $("#confirmOkButton").textContent = okText;
      $("#confirmCancelButton").textContent = cancelText;
      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
      return new Promise((resolve) => {
        const cleanup = (result) => {
          backdrop.classList.remove("open");
          backdrop.setAttribute("aria-hidden", "true");
          if (dialog) dialog.className = "confirm-dialog";
          $("#confirmOkButton").removeEventListener("click", onOk);
          $("#confirmCancelButton").removeEventListener("click", onCancel);
          backdrop.removeEventListener("click", onBackdrop);
          document.removeEventListener("keydown", onKeydown);
          resolve(result);
        };
        const onOk = () => cleanup(true);
        const onCancel = () => cleanup(false);
        const onBackdrop = (event) => {
          if (event.target === backdrop) cleanup(false);
        };
        const onKeydown = (event) => {
          if (event.key === "Escape") cleanup(false);
        };
        $("#confirmOkButton").addEventListener("click", onOk);
        $("#confirmCancelButton").addEventListener("click", onCancel);
        backdrop.addEventListener("click", onBackdrop);
        document.addEventListener("keydown", onKeydown);
        $("#confirmOkButton").focus();
      });
    }

    async function saveParticipantStatus(button) {
      const rowElement = button.closest("tr[data-schedule-key][data-participant-index]");
      if (!rowElement) return;
      const schedule = findSchedule(rowElement.dataset.scheduleKey);
      const participant = schedule?.participants?.[Number(rowElement.dataset.participantIndex)];
      if (!participant) return;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 저장 키를 찾을 수 없습니다.");
        return;
      }
      const fieldName = button.dataset.statusField;
      if (!fieldName) return;
      const fieldValue = button.dataset.statusValue || "";
      const actionLabel = getStatusActionLabel(fieldName, fieldValue);
      const confirmed = await openConfirmDialog({
        title: actionLabel,
        message: `${getParticipantName(participant) || "참여자"}님의 상태를 '${actionLabel}' 처리할까요?`,
        okText: actionLabel
      });
      if (!confirmed) return;
      const fields = {
        [fieldName]: fieldValue
      };
      fields.participantStatus = getParticipantStatusFromPayment({ ...participant, ...fields });
      const previousFields = {
        [fieldName]: participant[fieldName],
        participantStatus: participant.participantStatus,
        updatedAt: participant.updatedAt
      };
      button.disabled = true;
      Object.assign(participant, fields, { updatedAt: nowKstISOString() });
      renderMetrics();
      renderTable();
      try {
        const auth = getAdminAuth();
        const url = new URL(SHEET_API_ENDPOINT);
        url.searchParams.set("action", "admin_status_update");
        const response = await fetch(url.toString(), {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Golfjoin-Admin-Token": auth.token || ""
          },
          body: JSON.stringify({
            sheet: getParticipantSheetName(participant),
            keyField: "applicationId",
            keyValue: applicationId,
            fields,
            skipSummaryRefresh: true
          })
        });
        if (!response.ok) throw new Error(`저장 실패: ${response.status}`);
        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "저장에 실패했습니다.");
        Object.assign(participant, fields, { updatedAt: nowKstISOString() });
        renderMetrics();
        renderTable();
      } catch (error) {
        alert(error.message || "저장에 실패했습니다.");
      } finally {
        Object.assign(participant, previousFields);
        renderMetrics();
        if (state.currentSchedulePanel === "consultation") renderTable();
        button.disabled = false;
      }
    }

    function getQuoteEditorComputed(draft = {}) {
      const people = Math.max(1, Number(draft.people) || 1);
      const unitPrice = parseQuoteEditorAmount(draft.unitPrice);
      const singleRoomSurcharge = parseQuoteEditorAmount(draft.singleRoomSurcharge);
      const depositPerPerson = parseQuoteEditorAmount(draft.depositPerPerson);

      const estimatedTotal = productSubtotal + singleRoomSurcharge;
      const deposit = depositPerPerson * people;
      const balance = estimatedTotal ? Math.max(0, estimatedTotal - deposit) : 0;
      return { people, unitPrice, singleRoomSurcharge, depositPerPerson, productSubtotal, estimatedTotal, deposit, balance };
    }

      </style></head><body><main class="page"><section class="hero">${productImage ? `<img src="${escapeHtml(productImage)}" alt="">` : ""}<div class="hero-copy"><p class="kicker">SECRET TOUR · OVERSEAS GOLF JOIN</p><h1>${escapeHtml(draft.productName || "해외 골프 조인 견적")}</h1><div class="hero-meta"><span>${escapeHtml(regionText)}</span><span>${escapeHtml(draft.departureDate || "-")} - ${escapeHtml(draft.returnDate || "-")}</span></div></div></section><div class="body">
        <header class="head"><div><h2>예약요청 견적서</h2><p>내용 확인용 미리보기<br>확정 시 견적번호가 발급됩니다.</p></div><span class="status">담당자 확인 견적</span></header>

        <section><h3><span class="number">02</span>실제 상품 정보</h3><div class="lists"><div><h4>항공 일정</h4><ul>${renderQuoteEditorPreviewList(draft.flightScheduleItems, "상품 상세 확인 필요")}</ul></div><div><h4>주요 일정</h4><ul>${renderQuoteEditorPreviewList(draft.itineraryItems, "상품 상세 확인 필요")}</ul></div></div></section>
        <section><h3><span class="number">03</span>견적 금액</h3><table><tbody><tr><th>상품가</th><td>1인 기준 × ${amounts.people}명</td><td>${formatQuoteEditorAmount(amounts.productSubtotal)}</td></tr><tr><th>1인 1실 추가요금</th><td>${amounts.singleRoomSurcharge ? "신청 기준" : "해당 없음"}</td><td>${formatQuoteEditorAmount(amounts.singleRoomSurcharge, "-")}</td></tr><tr class="total-row"><th>예상 총액</th><td>담당자 산출</td><td>${formatQuoteEditorAmount(amounts.estimatedTotal)}</td></tr><tr><th>예약금</th><td>1인 ${formatQuoteEditorAmount(amounts.depositPerPerson)}</td><td>${formatQuoteEditorAmount(amounts.deposit)}</td></tr><tr><th>잔금</th><td>예약금 제외</td><td>${formatQuoteEditorAmount(amounts.balance, "0원")}</td></tr></tbody></table></section>
        <section><h3><span class="number">04</span>실제 상품 포함·불포함 사항</h3><div class="lists"><div><h4>포함 사항</h4><ul>${renderQuoteEditorPreviewList(draft.includedItems, "실제 상품 정보 확인 필요")}</ul></div><div><h4>불포함 사항</h4><ul>${renderQuoteEditorPreviewList(draft.excludedItems, "실제 상품 정보 확인 필요")}</ul></div></div></section>
        <section><h3><span class="number">05</span>상품 참고 및 견적 유의사항</h3><div class="lists"><div><h4>상품 참고사항</h4><ul>${renderQuoteEditorPreviewList(draft.productNotes, "등록된 상품 참고사항 없음")}</ul></div><div><h4>견적 유의사항</h4><div class="notice">${escapeHtml(draft.specialNotes || "-")}</div></div></div></section>
      </div></main></body></html>`;
    }

    function renderQuoteEditorPreview() {
      const preview = document.getElementById("quoteEditorPreview");
      if (!preview || !quoteEditorDraft) return;
      preview.srcdoc = buildQuoteEditorPreviewHtml(quoteEditorDraft);
    }

    function scheduleQuoteEditorPreview() {
      clearTimeout(quoteEditorPreviewTimer);
      quoteEditorPreviewTimer = setTimeout(renderQuoteEditorPreview, 80);
    }

    function populateQuoteEditorForm() {
      document.querySelectorAll("[data-quote-field]").forEach((field) => {
        const key = field.dataset.quoteField;
        field.value = quoteEditorDraft?.[key] == null ? "" : quoteEditorDraft[key];
      });
    }

    function syncQuoteEditorDraftFromForm() {
      if (!quoteEditorDraft) return;
      document.querySelectorAll("[data-quote-field]").forEach((field) => {
        const key = field.dataset.quoteField;
        quoteEditorDraft[key] = field.type === "number" ? parseQuoteEditorAmount(field.value) : field.value;
      });
      scheduleQuoteEditorPreview();
    }

    async function openQuoteEditor(button) {
      const context = getQuoteEditorContext(button);
      if (!context) {
        alert("견적서를 연결할 신청 정보를 찾을 수 없습니다.");
        return;
      }
      quoteEditorContext = context;
      quoteEditorDraft = buildQuoteEditorDraft(context);
      populateQuoteEditorForm();
      renderQuoteEditorPreview();
      const backdrop = document.getElementById("quoteEditorBackdrop");
      backdrop?.classList.add("open");
      backdrop?.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      setQuoteProductSourceState("실제 상품 상세 정보를 불러오는 중입니다.");
      const activeContext = context;
      try {
        const detail = await getProductDetailContent(context.schedule.row || {}, context.schedule.product || {});
        if (quoteEditorContext !== activeContext || !quoteEditorDraft) return;
        applyQuoteProductDetailToDraft(detail);
        populateQuoteEditorForm();
        renderQuoteEditorPreview();
        const hasRequiredProductDetail = Boolean(parseList(detail.includes).length && parseList(detail.excludes).length);
        if (hasRequiredProductDetail && !detail.loadError) {
          setQuoteProductSourceState("시크릿투어 실제 상품 상세의 포함·불포함·일정 정보를 불러왔습니다.", "success");
        } else if (hasRequiredProductDetail) {
          setQuoteProductSourceState("저장된 상품 정보에서 포함·불포함 사항을 불러왔습니다. 내용을 확인해 주세요.", "warning");
        } else {
          setQuoteProductSourceState("실제 상품의 포함·불포함 사항을 찾지 못했습니다. 상품 상세를 확인해 직접 입력해 주세요.", "warning");
        }
      } catch (error) {
        console.warn("Failed to load quote product detail.", error);
        if (quoteEditorContext === activeContext) {
          setQuoteProductSourceState("실제 상품 정보를 불러오지 못했습니다. 상품 상세를 확인해 직접 입력해 주세요.", "warning");
        }
      }
    }

    function closeQuoteEditor() {
      const backdrop = document.getElementById("quoteEditorBackdrop");
      backdrop?.classList.remove("open");
      backdrop?.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      quoteEditorContext = null;
      quoteEditorDraft = null;
      clearTimeout(quoteEditorPreviewTimer);
    }

    function validateQuoteEditorDraft(draft = {}) {
      if (!asText(draft.applicantName)) return "신청자명을 입력해 주세요.";
      if (!asText(draft.productName)) return "상품명을 입력해 주세요.";
      if (!normalizeQuoteEditorDate(draft.departureDate) || !normalizeQuoteEditorDate(draft.returnDate)) return "출발일과 도착일을 입력해 주세요.";
      if (!parseQuoteEditorAmount(draft.unitPrice)) return "1인 상품가를 입력해 주세요.";
      if (!parseList(draft.includedItems).length) return "실제 상품의 포함 사항을 입력해 주세요.";
      if (!parseList(draft.excludedItems).length) return "실제 상품의 불포함 사항을 입력해 주세요.";
      return "";
    }

    async function submitQuoteEditor() {
      if (!quoteEditorContext || !quoteEditorDraft) return;
      syncQuoteEditorDraftFromForm();
      const validationMessage = validateQuoteEditorDraft(quoteEditorDraft);
      if (validationMessage) {
        alert(validationMessage);
        return;
      }
      const { participant, schedule } = quoteEditorContext;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 신청 정보를 찾을 수 없습니다.");
        return;
      }
      const confirmButton = document.getElementById("quoteEditorConfirm");
      const auth = getAdminAuth();
      const url = new URL(SHEET_API_ENDPOINT);
      url.searchParams.set("action", "quote_generate");
      if (confirmButton) confirmButton.disabled = true;
      showDashboardLoading("고객용 견적 페이지와 PDF를 생성하는 중입니다.");
      try {
        const response = await fetch(url.toString(), {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Golfjoin-Admin-Token": auth.token || ""
          },
          body: JSON.stringify({
            sheet: getParticipantSheetName(participant),
            keyField: "applicationId",
            keyValue: applicationId,
            participant,
            schedule: schedule?.row || {},
            product: schedule?.product || {},
            quote: quoteEditorDraft
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || !result.ok) throw new Error(result.error || `견적서 생성 실패: ${response.status}`);
        Object.assign(participant, result.fields || {}, {
          quoteId: result.quoteId || result.fields?.quoteId || participant.quoteId,
          quoteNo: result.quoteNo || result.fields?.quoteNo || participant.quoteNo,
          quoteUrl: result.quoteUrl || result.fields?.quoteUrl || participant.quoteUrl,
          quotePageUrl: result.quotePageUrl || result.fields?.quotePageUrl || participant.quotePageUrl,
          quotePdfUrl: result.quotePdfUrl || result.fields?.quotePdfUrl || participant.quotePdfUrl,
          quoteFileName: result.quoteFileName || result.fields?.quoteFileName || participant.quoteFileName,
          quoteGeneratedAt: result.quoteGeneratedAt || result.fields?.quoteGeneratedAt || participant.quoteGeneratedAt,
          updatedAt: nowKstISOString()
        });
        const pageUrl = result.quotePageUrl || result.quoteUrl || result.fields?.quotePageUrl || result.fields?.quoteUrl || "";
        closeQuoteEditor();
        renderMetrics();
        renderTable();
        if (pageUrl) window.open(pageUrl, "_blank", "noopener");
      } catch (error) {
        const message = String(error?.message || "");
        alert(/abort|timed out|timeout/i.test(message)
          ? `견적서 생성 시간이 초과되었습니다.\n${message}\n잠시 후 다시 시도해 주세요.`
          : message || "견적서 생성에 실패했습니다.");
      } finally {
        hideDashboardLoading();
        if (confirmButton) confirmButton.disabled = false;
      }
    }

    async function saveQuoteComplete(button) {
      const rowElement = button.closest("tr[data-schedule-key][data-participant-index]");
      if (!rowElement) return;
      const schedule = findSchedule(rowElement.dataset.scheduleKey);
      const participant = schedule?.participants?.[Number(rowElement.dataset.participantIndex)];
      if (!participant) return;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 저장 키를 찾을 수 없습니다.");
        return;
      }
      button.disabled = true;
      const confirmed = await openConfirmDialog({
        title: "견적완료",
        message: `${getParticipantName(participant) || "참여자"}님의 상태를 '견적완료'로 처리할까요?`,
        okText: "견적완료"
      });
      if (!confirmed) return;
      const confirmedDuplicate = true || await openConfirmDialog({
        title: "견적완료",
        message: `${getParticipantName(participant) || "참여자"}님의 상태를 '견적완료'로 처리할까요?`,
        okText: "견적완료"
      });
      if (!confirmed) return;
      const fields = {
        quoteStatus: "sent",
        participantStatus: "견적완료"
      };
      const previousFields = {
        quoteStatus: participant.quoteStatus,
        participantStatus: participant.participantStatus,
        updatedAt: participant.updatedAt
      };
      Object.assign(participant, fields, { updatedAt: nowKstISOString() });
      button.classList.add("completed");
      button.innerHTML = `${renderCheckIcon()}<span>완료</span>`;
      renderMetrics();
      if (state.currentSchedulePanel === "consultation") renderTable();
      try {
        const fields = {
          quoteStatus: "sent",
          participantStatus: "견적완료"
        };
        const auth = getAdminAuth();
        const url = new URL(SHEET_API_ENDPOINT);
        url.searchParams.set("action", "admin_status_update");
        const response = await fetch(url.toString(), {
          method: "POST",
          cache: "no-store",
          headers: {
            "Content-Type": "application/json",
            "X-Golfjoin-Admin-Token": auth.token || ""
          },
          body: JSON.stringify({
            sheet: getParticipantSheetName(participant),
            keyField: "applicationId",
            keyValue: applicationId,
            fields,
            skipSummaryRefresh: true
          })
        });
        if (!response.ok) throw new Error(`저장 실패: ${response.status}`);
        const result = await response.json();
        if (!result.ok) throw new Error(result.error || "저장에 실패했습니다.");
        Object.assign(participant, fields, { updatedAt: nowKstISOString() });
        button.classList.add("completed");
        button.innerHTML = `${renderCheckIcon()}<span>완료</span>`;
        renderMetrics();
        setTimeout(() => {
          if (state.currentSchedulePanel === "consultation") renderTable();
        }, 700);
      } catch (error) {
        alert(error.message || "저장에 실패했습니다.");
        button.disabled = false;
      }
    }

    function openDrawer(title, sub, body, options = {}) {
      $("#drawerTitle").textContent = title;
      $("#drawerSub").textContent = sub || "";
      $("#drawerBody").innerHTML = body;
      const drawer = $("#drawer");
      drawer.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");
      $("#drawerBackdrop").classList.add("open");
    }

    function closeDrawer() {
      const drawer = $("#drawer");
      drawer.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      $("#drawerBackdrop").classList.remove("open");
    }

    function renderParticipantTable(schedule) {
      const participants = getParticipantDisplayRows(schedule.participants || []);
      return `
        <div class="participant-table-wrap">
          <table class="participant-table">
            <thead>
              <tr>
                <th>구분</th>
                <th>이름</th>
                <th>핸드폰번호</th>
                <th>인원</th>
                <th>성별구성</th>
                <th>객실</th>
                <th>항공</th>
                <th>성별</th>
                <th>나이</th>
                <th>핸디</th>
                <th>견적</th>
                <th>예약금</th>
                <th>잔금</th>
                <th>취소/환불</th>
              </tr>
            </thead>
            <tbody>
              ${participants.map((item) => renderParticipantRow(item.row, schedule, item.index, item.companions)).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function getParticipantDisplayRows(participants = []) {
      const rows = [];
      const groupMap = new Map();
      participants.forEach((row, index) => {
        const groupKey = firstText(row.companionGroup, row.groupId, row.applicationId, row.joinApplyId);
        if (groupKey && groupMap.has(groupKey)) {
          groupMap.get(groupKey).companions.push(row);
          return;
        }
        if (isCompanionOnlyParticipant(row)) {
          if (groupKey && groupMap.has(groupKey)) {
            groupMap.get(groupKey).companions.push(row);
            return;
          }
          const previous = rows[rows.length - 1];
          const samePhone = previous && normalizePhone(getParticipantPhone(previous.row)) === normalizePhone(getParticipantPhone(row));
          if (previous && (!groupKey || samePhone)) {
            previous.companions.push(row);
            return;
          }
        }
        const item = { row, index, companions: [] };
        rows.push(item);
        if (groupKey) groupMap.set(groupKey, item);
      });
      return rows;
    }

    function renderParticipantRow(row, schedule, index, companionRows = []) {
      const scheduleKey = schedule?.key || "";
      const birthYear = getParticipantBirthYear(row);
      const age = calculateAge(birthYear);
      const role = getParticipantRole(row);
      const roleLabel = getParticipantRoleLabel(row);
      return `
        <tr data-schedule-key="${escapeHtml(scheduleKey)}" data-participant-index="${escapeHtml(index)}">
          <td><span class="participant-role-badge ${role}">${escapeHtml(roleLabel)}</span></td>
          <td>
            <div class="participant-name-cell">
              <div class="participant-name-main">${escapeHtml(getParticipantName(row))}</div>
            </div>
          </td>
          <td>${escapeHtml(formatPhone(getParticipantPhone(row)))}</td>
          <td>${escapeHtml(`${getParticipantPeopleTotal(row, companionRows)}명`)}</td>
          <td>${renderParticipantGenderIcons(row, companionRows)}</td>
          <td>${renderParticipantRoomType(row)}</td>
          <td>${escapeHtml(getParticipantFlightRequestType(row, schedule) || "-")}</td>
          <td>${escapeHtml(getParticipantGender(row) || "-")}</td>
          <td>${escapeHtml(age ? `${age}세` : "-")}</td>
          <td>${escapeHtml(getParticipantHandicap(row) || "-")}</td>
          <td>${renderParticipantQuoteBadge(row)}</td>
          <td>${renderParticipantPaidBadge("depositStatus", row.depositStatus)}</td>
          <td>${renderParticipantPaidBadge("balanceStatus", row.balanceStatus)}</td>
          <td>${renderParticipantRefundBadges(row.refundStatus)}</td>
        </tr>
      `;
    }

    function normalizePaymentStatus(value) {
      const text = asText(value).toLowerCase();
      if (/paid|confirmed|complete|완료|확인|입금/.test(text)) return "paid";
      if (/request|progress|진행|요청|대기/.test(text)) return "requested";
      return "";
    }

    function normalizeQuoteStatus(value) {
      const text = asText(value).toLowerCase();
      if (/sent|done|complete|전송|발송|완료/.test(text)) return "sent";
      return "";
    }

    function renderParticipantStatusButton(field, value, label, options = {}) {
      const currentValue = asText(options.currentValue);
      const active = currentValue === value;
      const nextValue = active && options.clearable !== false ? "" : value;
      const stateClass = active ? ` ${options.activeClass || "is-complete"}` : "";
      return `<button class="participant-status-badge${stateClass}" type="button" data-action="participant-status-update" data-status-field="${escapeHtml(field)}" data-status-value="${escapeHtml(nextValue)}">${escapeHtml(label)}</button>`;
    }

    function renderParticipantQuoteBadge(row = {}) {
      const current = normalizeQuoteStatus(row.quoteStatus);
      return renderParticipantStatusButton("quoteStatus", "sent", current === "sent" ? "견적완료" : "미견적", {
        currentValue: current,
        activeClass: "is-complete"
      });
    }

    function renderParticipantPaidBadge(field, value) {
      const current = normalizePaymentStatus(value) === "paid" ? "paid" : "";
      return renderParticipantStatusButton(field, "paid", current === "paid" ? "입금완료" : "미납", {
        currentValue: current,
        activeClass: "is-complete"
      });
    }

    function renderParticipantStatusAction(field, value, label) {
      return `<button class="participant-status-action" type="button" data-action="participant-status-update" data-status-field="${escapeHtml(field)}" data-status-value="${escapeHtml(value)}">${escapeHtml(label)}</button>`;
    }

    function renderParticipantStatusCell(field, complete, valueLabel, actionLabel, actionValue = "paid") {
      return `
        <div class="participant-status-cell">
          <span class="participant-status-badge${complete ? " is-complete" : ""}">${escapeHtml(valueLabel)}</span>
          ${renderParticipantStatusAction(field, actionValue, actionLabel)}
        </div>
      `;
    }

    function renderParticipantQuoteBadge(row = {}) {
      const current = normalizeQuoteStatus(row.quoteStatus);
      return `
        <div class="quote-action-group">
          ${renderQuoteGenerateButton(row)}
          <span class="participant-status-badge${current === "sent" ? " is-complete" : ""}">${current === "sent" ? "견적완료" : "미견적"}</span>
        </div>
      `;

    function collectDetailList(row = {}, product = {}, paths = []) {
      const values = paths.flatMap((path) => {
        if (path.startsWith("product.")) return parseList(getNestedValue(product, path.replace(/^product\./, "")));
        if (path.startsWith("row.")) return parseList(getNestedValue(row, path.replace(/^row\./, "")));
        return parseList(row[path] || product[path]);
      });
      return [...new Set(values.map(asText).filter(Boolean))];
    }

    async function getProductDetailContent(row = {}, product = {}) {
      const actualDetail = await loadSecretTourGoodsDetail(row, product);
      const includes = collectDetailList(row, product, [
        "product.includes",
        "product.includeItems",
        "row.includes",
        "row.includeItems",
        "row.product.includes",
        "row.trip.includes",
        "row.included",
        "row.include",
        "row.포함사항"
      ]);
      const excludes = collectDetailList(row, product, [
        "product.excludes",
        "product.excludeItems",
        "row.excludes",
        "row.excludeItems",
        "row.product.excludes",
        "row.trip.excludes",
        "row.excluded",
        "row.exclude",
        "row.불포함사항"
      ]);
      const notes = collectDetailList(row, product, [
        "product.notes",
        "product.notice",
        "row.notes",
        "row.notice",
        "row.product.notes",
        "row.trip.notes",
        "row.reference",
        "row.참고사항"
      ]);
      const schedule = getProductScheduleItems(row, product);
      return {
        includes: parseList(actualDetail.includes).length ? parseList(actualDetail.includes) : includes,
        excludes: parseList(actualDetail.excludes).length ? parseList(actualDetail.excludes) : excludes,
        notes: parseList(actualDetail.notes).length ? parseList(actualDetail.notes) : notes,
        schedule: Array.isArray(actualDetail.schedule) && actualDetail.schedule.length ? actualDetail.schedule : schedule,
        departureAirport: normalizeSecretTourAirportName(actualDetail.departureAirport, row.departureAirport, product.departureAirport, product.airport),
        arrivalAirport: asText(actualDetail.arrivalAirport || row.arrivalAirport || product.arrivalAirport || product.arrAirport || product.toCity || product.arrivalCity),
        airline: normalizeSecretTourAirlineName(actualDetail.airline, row.airline, product.airline, product.air2Nm, product.air2CdNm),
        flightScheduleItems: parseList(actualDetail.flightScheduleItems),
        loadError: Boolean(actualDetail.loadError)
      };
    }

    function buildFlightInfo(row = {}, product = {}, detail = {}) {
      const actualItems = parseList(detail.flightScheduleItems);
      if (actualItems.length) return actualItems;
      const direct = [
        row.flightInfo,
        row.airline,
        row.flightCode,
        detail.airline,
        product.flightInfo,
        product.airline,
        product.flightCode
      ].map(asText).filter(Boolean);
      return [...new Set(direct)];
    }

    function renderList(items) {
      const list = parseList(items);
      if (!list.length) return '<div class="empty">등록된 내용이 없습니다.</div>';
      return `<ul class="list">${list.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function getProductScheduleItems(row = {}, product = {}) {
      const candidates = [
        product.schedule,
        product.itinerary,
        row.schedule,
        row.itinerary,
        getNestedValue(row, "product.schedule"),
        getNestedValue(row, "trip.schedule"),
        row.scheduleItems,
        row.scheduleJson,
        row.일정표
      ];
      for (const candidate of candidates) {
        if (Array.isArray(candidate) && candidate.length) return candidate;
        const text = asText(candidate);
        if (!text) continue;
        try {
          const parsed = JSON.parse(text);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        } catch (error) {}
        const list = parseList(text);
        if (list.length) return list;
      }
      return [];
    }

    function renderProductSchedule(scheduleItems) {
      if (!Array.isArray(scheduleItems) || !scheduleItems.length) return '<div class="empty">등록된 일정표가 없습니다.</div>';
      return scheduleItems.map((item, index) => {
        if (typeof item === "string") {
          return `<div class="schedule-day"><div class="schedule-day-title">${index + 1}일차</div><div class="info-value">${escapeHtml(item)}</div></div>`;
        }
        const points = parseList(item.points || item.items || item.content || item.description);
        const hotel = asText(item.hotel);
        const meal = formatMealSummary(item.meal || item.meals);
        return `
          <div class="schedule-day">
            <div class="schedule-day-title">${escapeHtml(item.day || `${index + 1}일차`)} ${escapeHtml(item.date || item.dateText || "")}</div>
            ${points.length ? renderList(points) : `<div class="info-value">${escapeHtml(item.title || item.description || "-")}</div>`}
            ${hotel ? `<div class="info-value schedule-day-meta">호텔: ${escapeHtml(hotel)}</div>` : ""}
            ${meal ? `<div class="info-value schedule-day-meta">식사: ${escapeHtml(meal)}</div>` : ""}
          </div>
        `;
      }).join("");
    }

    function formatMealSummary(value) {
      if (Array.isArray(value)) {
        return value.map((meal) => {
          if (typeof meal === "string") return asText(meal);
          return cleanSecretTourDetailText([meal.label, meal.menu].filter(Boolean).join(": "));
        }).filter(Boolean).join(" / ");
      }
      return asText(value);
    }

    function downloadRowsAsCsv(rows, filename) {
      const headers = Object.keys(rows[0]);
      const csv = [
        headers.join(","),
        ...rows.map((row) => headers.map((key) => `"${String(row[key] ?? "").replace(/"/g, '""')}"`).join(","))
      ].join("\n");
      const blob = new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
      URL.revokeObjectURL(link.href);
    }

      const auth = getAdminAuth();
      const response = await fetch(SHEET_API_ENDPOINT, {
        method: "POST",
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          "X-Golfjoin-Admin-Token": auth.token || ""
        },
        body: JSON.stringify({

          source: "recommended_schedule",
          sheet: "recommended_schedules",

          keyField: "recommendedScheduleId",
          keyValue: payload.recommendedScheduleId
        })
      });
      if (!response.ok) throw new Error(`추천 일정 저장 실패: ${response.status}`);
      const result = await response.json();

    async function saveRecommendationScheduleByKey(productKey, options = {}) {
      const selected = findRecommendationProductByKey(productKey || "");
      if (!selected) {
        alert("추천 일정으로 등록할 상품/출발일을 선택하세요.");
        return;
      }
      const product = selected.product;
      const recommendedScheduleId = `rs-${selected.goodSeq}-${selected.eventSeq}`;
      const existingRule = state.displayRules.find((rule) => getRecommendationDisplayRuleId(rule) === recommendedScheduleId);
      const actualDetail = await loadSecretTourGoodsDetail({}, product);
      const productPackType = getPackType({}, { ...product, ...actualDetail });
      const productPackTypeName = getPackLabel(productPackType);
      const departureAirport = normalizeSecretTourAirportName(actualDetail.departureAirport, product.departureAirport, product.depAirport, product.airport, product.airportName);
      const arrivalAirport = asText(actualDetail.arrivalAirport || product.arrivalAirport || product.arrAirport || product.toCity || product.arrivalCity);
      const airline = normalizeSecretTourAirlineName(actualDetail.airline, product.airline, product.air2Nm, product.air2CdNm);
      const capacity = normalizeRecommendationCapacity(options.capacity || existingRule?.capacity, 4);
      const isMonthly = Boolean(options.monthly) || isMonthlyRecommendationRule(existingRule);
      const tripSummary = extractTripSummaryPeriod({ productName: product.title || "", title: product.title || "", tripSummary: product.tripSummary || product.dayNightCnt || product.duration || "" }, product)
        || formatTripNightsDays(product.departureDate || "", product.returnDate || product.departureDate || "");
      const payload = {
        recommendedScheduleId,
        erpProductId: selected.goodSeq,
        erpEventSeq: selected.eventSeq,
        section: "available_schedule",
        isVisible: true,
        isPinned: true,
        displayOrder: Number(existingRule?.displayOrder || getActiveRecommendationRules().length + 1),
        badgeType: isMonthly ? "monthly" : "recommended",
        scheduleType: isMonthly ? "monthly" : "",
        scheduleLabel: isMonthly ? "월례회" : "",
        capacity: String(capacity),
        maxPeople: String(capacity),
        packType: productPackType,
        packTypeName: productPackTypeName,
        overrideTitle: product.title || "",
        overrideImageUrl: product.image || "",
        country: getRecommendationProductCountry(product),
        region: getRecommendationProductRegion(product),
        departureAirport,
        arrivalAirport,
        airline,
        productPrice: product.price || "",
        displayStartAt: product.departureDate || "",
        displayEndAt: product.returnDate || product.departureDate || "",
        tripSummary,
        adminMemo: existingRule?.adminMemo || ""
      };
      await submitProductDisplayRule(payload);
      const currentIndex = state.displayRules.findIndex((rule) => getRecommendationDisplayRuleId(rule) === recommendedScheduleId);
      if (currentIndex >= 0) state.displayRules.splice(currentIndex, 1, { ...state.displayRules[currentIndex], ...payload, updatedAt: nowKstISOString() });
      else state.displayRules.unshift({ ...payload, updatedAt: nowKstISOString() });
      renderMetrics();
      renderTable();
    }

    async function submitAdminStatusUpdate(participant, applicationId, fields) {
      const auth = getAdminAuth();
      const url = new URL(SHEET_API_ENDPOINT);
      url.searchParams.set("action", "admin_status_update");
      const response = await fetch(url.toString(), {
        method: "POST",
        cache: "no-store",
        headers: {
          "Content-Type": "application/json",
          "X-Golfjoin-Admin-Token": auth.token || ""
        },
        body: JSON.stringify({
          sheet: getParticipantSheetName(participant),
          keyField: "applicationId",
          keyValue: applicationId,
          fields,
          skipSummaryRefresh: true
        })
      });
      if (!response.ok) throw new Error(`저장 실패: ${response.status}`);
      const result = await response.json();
      if (!result.ok) throw new Error(result.error || "저장에 실패했습니다.");
      return result;
    }

    async function saveParticipantStatus(button) {
      const rowElement = button.closest("tr[data-schedule-key][data-participant-index]");
      if (!rowElement) return;
      const schedule = findSchedule(rowElement.dataset.scheduleKey);
      const participant = schedule?.participants?.[Number(rowElement.dataset.participantIndex)];
      if (!participant) return;
      const applicationId = getParticipantApplicationId(participant);
      if (!applicationId) {
        alert("참여자 저장 행을 찾을 수 없습니다.");
        return;
      }
      const fieldName = button.dataset.statusField;
      if (!fieldName) return;
      const fieldValue = button.dataset.statusValue || "";
      const actionLabel = getStatusActionLabel(fieldName, fieldValue);
      const confirmed = await openConfirmDialog({
        title: actionLabel,
        message: `${getParticipantName(participant) || "참여자"}님의 상태를 '${actionLabel}' 처리할까요?`,
        okText: actionLabel
      });
      if (!confirmed) return;
      const fields = {
        [fieldName]: fieldValue
      };
      fields.participantStatus = getParticipantStatusFromPayment({ ...participant, ...fields });
      const previousFields = {
        [fieldName]: participant[fieldName],
        participantStatus: participant.participantStatus,
        updatedAt: participant.updatedAt
      };
      Object.assign(participant, fields, { updatedAt: nowKstISOString() });
      renderMetrics();
      renderTable();
      try {
        await submitAdminStatusUpdate(participant, applicationId, fields);
      } catch (error) {
        Object.assign(participant, previousFields);
        renderMetrics();
        renderTable();
        alert(error.message || "저장에 실패했습니다.");
      }
    }
