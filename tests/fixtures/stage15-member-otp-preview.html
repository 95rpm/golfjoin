<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stage 15 SMS 인증 UI 미리보기</title>
  <link rel="stylesheet" href="/src/golfjoin-main/source/styles/10-main.css">
</head>
<body>
  <div class="overlay join-member-login-overlay open" id="joinMemberLoginModal">
    <div class="modal join-member-login-modal is-otp-mode" role="dialog" aria-modal="true" aria-labelledby="joinMemberLoginTitle">
      <div class="join-member-login-header">
        <button type="button" class="join-member-login-back" aria-label="뒤로 가기">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7"></path>
            <path d="M19 12H5"></path>
          </svg>
        </button>
        <div class="join-member-login-title" id="joinMemberLoginTitle">휴대폰 인증</div>
      </div>
      <div class="join-member-login-body">
        <div class="join-member-login-main">
          <div class="join-member-login-actions">
            <div class="join-member-otp-form" id="joinMemberOtpForm" aria-labelledby="joinMemberLoginTitle">
              <div class="join-member-otp-copy">
                <div class="join-member-signup-step-title">인증번호가 발송됐어요</div>
                <div class="join-member-signup-step-desc" id="joinMemberOtpDestination">010-xxxx-6845</div>
              </div>
              <label class="join-member-email-field" for="joinMemberOtpCode" id="joinMemberOtpCodeField">
                <div class="join-member-email-label">인증번호 6자리</div>
                <div class="join-member-email-input-wrap join-member-otp-input-wrap">
                  <input type="text" id="joinMemberOtpCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="인증번호 입력">
                  <span class="join-member-otp-timer" id="joinMemberOtpTimer" aria-live="polite">03:00</span>
                </div>
                <div class="join-member-email-helper" id="joinMemberOtpCodeHelper" aria-live="polite"></div>
              </label>
              <button type="button" class="join-member-login-button signup" id="joinMemberOtpVerifyButton">인증하기</button>
              <button type="button" class="join-member-otp-resend" id="joinMemberOtpResendButton" disabled>인증번호 다시 받기</button>
              <div class="join-member-otp-status" id="joinMemberOtpStatus" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
